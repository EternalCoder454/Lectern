# Gradle talks to its workers over a loopback socket; on a path with a space in it they fail to
# start with an error that reads like a build-script fault and is not one. Set TMP/TEMP to a
# space-free path before building, and keep the IPv4 pin.
org.gradle.jvmargs=-Xmx4G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true

# The loader this branch builds for, and the name of the source set holding its code.
# src/main names no loader; src/<lectern.loader> is the only place allowed to.
lectern.loader=neoforge

minecraft_version=26.1.2
neoforge_version=26.1.2.95
mdg_version=2.0.144

parchment_mc_version=1.21.11
parchment_version=2025.12.20

group=net.lectern
mod_version=0.1.0
java_version=25
